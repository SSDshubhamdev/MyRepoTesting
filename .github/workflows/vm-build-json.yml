name: VM Build Excel to JSON

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Service Request No. from the Excel"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-json:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required GitHub Secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "SMTP_USERNAME",
            "SMTP_APP_PASSWORD"
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing GitHub secret: $name"
            }
          }

          Write-Host "Required secrets are configured."

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Verify Azure Login
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $result = & az account show `
            --subscription $env:SUBSCRIPTION_ID `
            --output table 2>&1

          if ($LASTEXITCODE -ne 0) {
            throw "Azure login verification failed: $($result -join "`n")"
          }

          $result | Write-Host
          
      # STEP 5: Validate storage configuration and request ID
      - name: Validate Pipeline Configuration
        shell: pwsh
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          INPUT_CONTAINER: ${{ vars.VM_BUILD_INPUT_CONTAINER }}
          OUTPUT_CONTAINER: ${{ vars.VM_BUILD_JSON_CONTAINER }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "STORAGE_ACCOUNT",
            "INPUT_CONTAINER",
            "OUTPUT_CONTAINER",
            "REQUEST_ID"
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing GitHub variable or input: $name"
            }
          }

          if ($env:REQUEST_ID -notmatch '^[A-Za-z0-9_-]+$') {
            throw "Request ID contains unsupported characters."
          }

          Write-Host "Storage configuration and Request ID validated."

      # STEP 6: Install ImportExcel
      - name: Install ImportExcel Module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Module -ListAvailable -Name ImportExcel)) {
            Install-Module ImportExcel `
              -Scope CurrentUser `
              -Force `
              -AllowClobber
          }

          Import-Module ImportExcel -ErrorAction Stop
          Write-Host "ImportExcel module is ready."

      # STEP 7: Download Excel from input container
      - name: Download Excel from Azure Blob
        shell: pwsh
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          INPUT_CONTAINER: ${{ vars.VM_BUILD_INPUT_CONTAINER }}
        run: |
          $ErrorActionPreference = "Stop"

          $blobName = "VM_BuildSheet.xlsx"
          $excelPath = Join-Path $env:RUNNER_TEMP $blobName

          az storage blob download `
            --account-name $env:STORAGE_ACCOUNT `
            --container-name $env:INPUT_CONTAINER `
            --name $blobName `
            --file $excelPath `
            --auth-mode login `
            --only-show-errors `
            --output none

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Excel from Azure Blob Storage."
          }

          if (!(Test-Path -LiteralPath $excelPath)) {
            throw "Downloaded Excel file was not found."
          }

          "EXCEL_PATH=$excelPath" >> $env:GITHUB_ENV

          Write-Host "Excel downloaded successfully: $blobName"

      # STEP 8: Convert Excel into JSON
      - name: Convert Excel to JSON
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $converterPath = Join-Path $env:GITHUB_WORKSPACE `
            "scripts/Build-VMJson.ps1"

          if (!(Test-Path -LiteralPath $converterPath)) {
            throw "Converter script not found: $converterPath"
          }

          if (!(Test-Path -LiteralPath $env:EXCEL_PATH)) {
            throw "Excel input file does not exist."
          }

          $outputPath = Join-Path $env:RUNNER_TEMP `
            "$($env:REQUEST_ID).json"

          & $converterPath `
            -ExcelPath $env:EXCEL_PATH `
            -RequestId $env:REQUEST_ID `
            -OutputPath $outputPath

          if (!(Test-Path -LiteralPath $outputPath)) {
            throw "JSON file was not generated."
          }

          $jsonContent = Get-Content `
            -LiteralPath $outputPath `
            -Raw

          $null = ConvertFrom-Json `
            -InputObject $jsonContent `
            -ErrorAction Stop

          "JSON_PATH=$outputPath" >> $env:GITHUB_ENV

          Write-Host "JSON conversion and syntax validation succeeded."

      # STEP 9: Upload JSON to output container
      - name: Upload JSON to Azure Blob
        shell: pwsh
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          OUTPUT_CONTAINER: ${{ vars.VM_BUILD_JSON_CONTAINER }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path -LiteralPath $env:JSON_PATH)) {
            throw "JSON output file was not found."
          }

          $blobName = "$($env:REQUEST_ID)/$($env:REQUEST_ID).json"

          az storage blob upload `
            --account-name $env:STORAGE_ACCOUNT `
            --container-name $env:OUTPUT_CONTAINER `
            --name $blobName `
            --file $env:JSON_PATH `
            --auth-mode login `
            --overwrite true `
            --only-show-errors `
            --output none

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload JSON to Azure Blob Storage."
          }

          Write-Host "JSON uploaded successfully."
          Write-Host "Output container: $($env:OUTPUT_CONTAINER)"
          Write-Host "Output blob: $blobName"
