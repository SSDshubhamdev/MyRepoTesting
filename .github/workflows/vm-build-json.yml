
name: VM Build Excel to JSON

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Service Request No. from the Excel"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-json:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install PowerShell Excel module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Install-Module ImportExcel -Scope CurrentUser -Force -AllowClobber

      - name: Download Excel from Azure Blob
        shell: pwsh
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          INPUT_CONTAINER: ${{ vars.VM_BUILD_INPUT_CONTAINER }}
        run: |
          $ErrorActionPreference = "Stop"

          $blobName = "VM_BuildSheet.xlsx"
          $excelPath = Join-Path $env:RUNNER_TEMP $blobName

          if ([string]::IsNullOrWhiteSpace($env:STORAGE_ACCOUNT)) {
            throw "Repository variable AZURE_STORAGE_ACCOUNT is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:INPUT_CONTAINER)) {
            throw "Repository variable VM_BUILD_INPUT_CONTAINER is missing."
          }

          az storage blob download `
            --account-name $env:STORAGE_ACCOUNT `
            --container-name $env:INPUT_CONTAINER `
            --name $blobName `
            --file $excelPath `
            --auth-mode login `
            --only-show-errors `
            --output none

          if ($LASTEXITCODE -ne 0 -or !(Test-Path $excelPath)) {
            throw "Failed to download $blobName from container $($env:INPUT_CONTAINER)."
          }

          "EXCEL_PATH=$excelPath" >> $env:GITHUB_ENV
          Write-Host "Excel downloaded successfully."

      - name: Convert Excel to JSON
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $outputPath = Join-Path $env:RUNNER_TEMP "$($env:REQUEST_ID).json"

          ./scripts/Build-VMJson.ps1 `
            -ExcelPath $env:EXCEL_PATH `
            -RequestId $env:REQUEST_ID `
            -OutputPath $outputPath

          if (!(Test-Path $outputPath)) {
            throw "JSON file was not generated."
          }

          "JSON_PATH=$outputPath" >> $env:GITHUB_ENV

      - name: Upload JSON to Azure Blob
        shell: pwsh
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          OUTPUT_CONTAINER: ${{ vars.VM_BUILD_JSON_CONTAINER }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $blobName = "$($env:REQUEST_ID)/$($env:REQUEST_ID).json"

          az storage blob upload `
            --account-name $env:STORAGE_ACCOUNT `
            --container-name $env:OUTPUT_CONTAINER `
            --name $blobName `
            --file $env:JSON_PATH `
            --auth-mode login `
            --overwrite true `
            --only-show-errors `
            --output none

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the JSON file."
          }

          Write-Host "JSON uploaded successfully."
          Write-Host "Output container: $($env:OUTPUT_CONTAINER)"
          Write-Host "Output blob: $blobName"
