```yaml
name: VM Build Excel to JSON

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Service Request No. from the Excel"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-json:
    runs-on: windows-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Validate GitHub secrets
      - name: Verify Required GitHub Secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID"
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing GitHub secret: $name"
            }
          }

          Write-Host "Required secrets are configured."

      # 3. Login using the NEW App Registration
      - name: Azure Login using New OIDC App
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Verify Azure login
      - name: Verify Azure Login
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = "Stop"

          $result = & az account show `
            --subscription $env:SUBSCRIPTION_ID `
            --output table 2>&1

          if ($LASTEXITCODE -ne 0) {
            throw "Azure login verification failed: $($result -join "`n")"
          }

          $result | Write-Host
          Write-Host "Azure OIDC login successful."

      # 5. Validate storage variables and request ID
      - name: Validate Configuration
        shell: pwsh
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          INPUT_CONTAINER: ${{ vars.VM_BUILD_INPUT_CONTAINER }}
          OUTPUT_CONTAINER: ${{ vars.VM_BUILD_JSON_CONTAINER }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($name in @(
            "STORAGE_ACCOUNT",
            "INPUT_CONTAINER",
            "OUTPUT_CONTAINER",
            "REQUEST_ID"
          )) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing configuration: $name"
            }
          }

          if ($env:REQUEST_ID -notmatch '^[A-Za-z0-9_-]+$') {
            throw "Request ID contains unsupported characters."
          }

          Write-Host "Configuration validated."

      # 6. Install ImportExcel
      - name: Install ImportExcel Module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Module -ListAvailable -Name ImportExcel)) {
            Install-Module ImportExcel `
              -Scope CurrentUser `
              -Force `
              -AllowClobber
          }

          Import-Module ImportExcel -ErrorAction Stop
          Write-Host "ImportExcel module is ready."

      # 7. Download Excel from Azure Blob
      - name: Download Excel from Azure Blob
        shell: pwsh
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          INPUT_CONTAINER: ${{ vars.VM_BUILD_INPUT_CONTAINER }}
        run: |
          $ErrorActionPreference = "Stop"

          $blobName = "VM_BuildSheet.xlsx"
          $excelPath = Join-Path $env:RUNNER_TEMP $blobName

          az storage blob download `
            --account-name $env:STORAGE_ACCOUNT `
            --container-name $env:INPUT_CONTAINER `
            --name $blobName `
            --file $excelPath `
            --auth-mode login `
            --only-show-errors `
            --output none

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Excel from Azure Blob."
          }

          if (!(Test-Path -LiteralPath $excelPath)) {
            throw "Downloaded Excel file was not found."
          }

          "EXCEL_PATH=$excelPath" >> $env:GITHUB_ENV
          Write-Host "Excel downloaded successfully."

      # 8. Convert Excel to JSON
      - name: Convert Excel to JSON
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE `
            "scripts/Build-VMJson.ps1"

          if (!(Test-Path -LiteralPath $scriptPath)) {
            throw "Converter script not found: $scriptPath"
          }

          $outputPath = Join-Path $env:RUNNER_TEMP `
            "$($env:REQUEST_ID).json"

          & $scriptPath `
            -ExcelPath $env:EXCEL_PATH `
            -RequestId $env:REQUEST_ID `
            -OutputPath $outputPath

          if (!(Test-Path -LiteralPath $outputPath)) {
            throw "JSON output file was not generated."
          }

          $jsonContent = Get-Content -LiteralPath $outputPath -Raw
          $null = ConvertFrom-Json -InputObject $jsonContent -ErrorAction Stop

          "JSON_PATH=$outputPath" >> $env:GITHUB_ENV
          Write-Host "JSON generated and validated."

      # 9. Upload JSON to output container
      - name: Upload JSON to Azure Blob
        shell: pwsh
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          OUTPUT_CONTAINER: ${{ vars.VM_BUILD_JSON_CONTAINER }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path -LiteralPath $env:JSON_PATH)) {
            throw "JSON output file was not found."
          }

          $blobName = "$($env:REQUEST_ID)/$($env:REQUEST_ID).json"

          az storage blob upload `
            --account-name $env:STORAGE_ACCOUNT `
            --container-name $env:OUTPUT_CONTAINER `
            --name $blobName `
            --file $env:JSON_PATH `
            --auth-mode login `
            --overwrite true `
            --only-show-errors `
            --output none

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload JSON to Azure Blob."
          }

          Write-Host "JSON uploaded successfully."
          Write-Host "Output container: $($env:OUTPUT_CONTAINER)"
          Write-Host "Output blob: $blobName"
```
